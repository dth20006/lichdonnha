<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quản lý Nhiệm vụ Hằng ngày</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

body{
font-family: 'Inter', sans-serif;
margin:0;
padding:20px;
background:#0f172a;
color:white;
}

.container{
max-width:1100px;
margin:auto;
}

.title{
font-size:32px;
font-weight:700;
margin-bottom:20px;
text-align: center;
color: #00f2ff;
text-shadow: 0 0 10px rgba(0,242,255,0.5);
}

.card{
background:rgba(0,255,255,0.05);
border:1px solid rgba(0,255,255,0.2);
box-shadow:0 0 15px rgba(0,255,255,0.1);
border-radius:16px;
padding:20px;
margin-bottom:20px;
backdrop-filter:blur(6px);
}

.users{
display:flex;
gap:15px;
justify-content: center;
}

.user{
flex:1;
padding:15px;
border-radius:12px;
background:#1e293b;
text-align:center;
cursor:pointer;
font-weight:600;
transition: 0.3s;
border: 1px solid transparent;
}

.user:hover {
background: #334155;
border-color: #00f2ff;
}

.taskBox{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
border-radius:12px;
background:#1e293b;
border-left: 5px solid #00f2ff;
transition: all 0.3s ease;
}

.taskCheck{
width:26px;
height:26px;
cursor:pointer;
accent-color:#22c55e;
transform:scale(1.2);
transition:all .2s ease;
}

.taskCheck:checked{
transform:scale(1.4);
box-shadow:0 0 10px #22c55e;
}

.taskComplete{
animation: glowDone 0.6s ease;
background: rgba(34, 197, 94, 0.1);
border-left-color: #22c55e;
}

@keyframes glowDone{
0%{box-shadow:0 0 0px #22c55e}
50%{box-shadow:0 0 25px #22c55e}
100%{box-shadow:0 0 0px #22c55e}
}

.heatmap{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
}

.day{
width:100%;
aspect-ratio: 1/1;
background:#1e293b;
border-radius:4px;
}

.level1{background:#9be9a8}
.level2{background:#40c463}
.level3{background:#30a14e}
.level4{background:#216e39}

.rank{
padding:8px 0;
border-bottom: 1px solid rgba(255,255,255,0.05);
}

#donePopup{
position:fixed;
bottom:30px;
right:30px;
background:#22c55e;
color:white;
padding:15px 25px;
border-radius:12px;
font-weight:600;
display:none;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);
z-index: 1000;
}

h3 {
margin-top: 0;
color: #94a3b8;
font-size: 1rem;
text-transform: uppercase;
letter-spacing: 1px;
}

</style>

</head>

<body>

<div class="container">

<div class="title">📋 HỆ THỐNG NHIỆM VỤ</div>

<div class="card">
    <h3 style="text-align: center;">Chọn thành viên</h3>
    <div class="users">
        <div class="user" onclick="login('Chi')">Chi</div>
        <div class="user" onclick="login('Kiệt')">Kiệt</div>
        <div class="user" onclick="login('Hùng')">Hùng</div>
    </div>
</div>

<div id="app" style="display:none">

<div class="card">
    <h3>📅 Nhiệm vụ hôm nay</h3>
    <div id="tasks"></div>
</div>

<div class="card">
    <h3>🔥 Chỉ số & Cấp độ</h3>
    <div id="xp"></div>
</div>

<div class="card">
    <h3>📊 Biểu đồ tuần</h3>
    <canvas id="chart"></canvas>
</div>

<div class="card">
    <h3>📊 Biểu đồ nhiệt (30 ngày)</h3>
    <div id="heatmap" class="heatmap"></div>
</div>

<div class="card">
    <h3>🥇 Bảng xếp hạng</h3>
    <div id="ranking"></div>
</div>

<div class="card">
    <h3>🧠 AI Phân tích</h3>
    <div id="lazy"></div>
</div>

</div>

</div>

<div id="donePopup">✅ Nhiệm vụ đã hoàn thành!</div>

<script>

// Cấu hình Firebase
const firebaseConfig={
apiKey:"AIzaSyCAH5iHPMiJ8DzAK_CvzlKOlpMlSzGJgLs",
authDomain:"firebawweb.firebaseapp.com",
projectId:"firebawweb",
storageBucket:"firebawweb.firebasestorage.app",
messagingSenderId:"246960541396",
appId:"1:246960541396:web:f1c7774f4fdfcae71f7541"
}

firebase.initializeApp(firebaseConfig)
const db=firebase.firestore()

// Cấu hình Telegram
const TOKEN="8701701011:AAHbo0avSZXuCX3hGY0NdezE_Ef51GZRE-c"
const CHAT_ID="-5237126120"

let user=""
let schedule={}

function login(name){
    user = name
    document.getElementById("app").style.display="block"
    assignAI()
    listenTasks()
}

async function assignAI(){
    let snapshot = await db.collection("tasks").get()
    let score = {Chi:0, Kiệt:0, Hùng:0}
    snapshot.forEach(doc => {
        let d = doc.data()
        if(score[d.user] !== undefined) score[d.user]++
    })
    let jobs = ["Đổ rác", "Rửa bát", "Nấu Cơm"]
    let users = Object.entries(score).sort((a,b) => a[1] - b[1])
    schedule = {}
    for(let i=0; i<users.length; i++){
        schedule[users[i][0]] = jobs[i]
    }
    renderTasks()
}

function renderTasks(){
    let job = schedule[user]
    document.getElementById("tasks").innerHTML = `
        <div class="taskBox">
            <div><strong>${job}</strong></div>
            <input class="taskCheck" type="checkbox" onclick="doneTask('${job}', this)">
        </div>
    `
}

async function doneTask(job, el){
    await db.collection("tasks").add({
        user: user,
        job: job,
        time: Date.now()
    })

    showDonePopup()
    launchConfetti()
    el.parentElement.classList.add("taskComplete")
    el.disabled = true;
    
    sendTelegram(user, job)
}

function launchConfetti(){
    confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } })
    setTimeout(() => {
        confetti({ particleCount: 80, angle: 60, spread: 55, origin: { x: 0 } })
        confetti({ particleCount: 80, angle: 120, spread: 55, origin: { x: 1 } })
    }, 300)
}

function showDonePopup(){
    let pop = document.getElementById("donePopup")
    pop.style.display = "block"
    setTimeout(() => { pop.style.display = "none" }, 3000)
}

function listenTasks(){
    db.collection("tasks").onSnapshot(snapshot => {
        let data = []
        snapshot.forEach(doc => data.push(doc.data()))
        updateUI(data)
    })
}

function updateUI(data){
    ranking(data); heatmap(data); chart(data); 
    xp(data); badge(data); lazy(data);
}

function ranking(data){
    let score = {Chi:0, Kiệt:0, Hùng:0}
    data.forEach(d => score[d.user]++)
    let arr = Object.entries(score).sort((a,b) => b[1] - a[1])
    let html = ""
    arr.forEach((u, i) => {
        let icon = i === 0 ? "🥇" : (i === 1 ? "🥈" : "🥉")
        html += `<div class="rank">${icon} ${u[0]} — ${u[1]} nhiệm vụ</div>`
    })
    document.getElementById("ranking").innerHTML = html
}

function xp(data){
    let count = data.filter(t => t.user == user).length
    let xpVal = count * 10
    document.getElementById("xp").innerHTML = `⭐ XP: ${xpVal} | Level: ${Math.floor(xpVal/100)}`
}

function badge(data){
    // Logic badge cũ nếu cần dùng lại
}

function lazy(data){
    let score = {Chi:0, Kiệt:0, Hùng:0}
    data.forEach(d => score[d.user]++)
    let lazyUser = Object.entries(score).sort((a,b) => a[1] - b[1])[0]
    document.getElementById("lazy").innerHTML = `🤖 Phân tích: <strong>${lazyUser[0]}</strong> đang cần tăng tốc!`
}

function heatmap(data){
    let map = document.getElementById("heatmap")
    map.innerHTML = ""
    for(let i=29; i>=0; i--){
        let d = new Date(); d.setDate(d.getDate() - i)
        let count = data.filter(t => new Date(t.time).toDateString() == d.toDateString()).length
        let level = count > 6 ? 4 : (count > 4 ? 3 : (count > 2 ? 2 : (count > 0 ? 1 : 0)))
        map.innerHTML += `<div class="day level${level}" title="${d.toLocaleDateString()}"></div>`
    }
}

let myChart;
function chart(data){
    let week = [0,0,0,0,0,0,0]
    data.forEach(d => { week[new Date(d.time).getDay()]++ })
    if(myChart) myChart.destroy()
    myChart = new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: ["CN", "T2", "T3", "T4", "T5", "T6", "T7"],
            datasets: [{ label: "Nhiệm vụ", data: week, borderColor: '#00f2ff', tension: 0.4 }]
        },
        options: { plugins: { legend: { labels: { color: 'white' } } } }
    })
}

// --- TELEGRAM CARD UI SECTION ---

function sendTelegram(name, job){
    let time = new Date().toLocaleString("vi-VN")
    let text = `🏠 *ROOM TASK AI*\n\n✅ *Nhiệm vụ hoàn thành*\n\n👤 *Thành viên:* ${name}\n📌 *Công việc:* ${job}\n\n━━━━━━━━━━━━━━\n⏰ ${time}`

    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: "Markdown",
            reply_markup: {
                inline_keyboard: [
                    [
                        { text: "🏆 Ranking", callback_data: "ranking" },
                        { text: "📋 Tasks", callback_data: "tasks" }
                    ],
                    [
                        { text: "⭐ XP", callback_data: "xp" },
                        { text: "🤖 AI", callback_data: "ai" }
                    ]
                ]
            }
        })
    })
}

async function sendRanking(){
    let snapshot = await db.collection("tasks").get()
    let score = { Chi: 0, Kiệt: 0, Hùng: 0 }
    snapshot.forEach(doc => {
        let d = doc.data()
        if(score[d.user] !== undefined) score[d.user]++
    })

    let arr = Object.entries(score).sort((a, b) => b[1] - a[1])
    let text = "🏆 *Bảng xếp hạng*\n\n"
    arr.forEach((u, i) => {
        let icon = i == 0 ? "🥇" : (i == 1 ? "🥈" : "🥉")
        text += `${icon} *${u[0]}* — ${u[1]} việc\n`
    })

    telegramCard(text)
}

function telegramCard(content){
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            chat_id: CHAT_ID,
            text: `🏠 *ROOM TASK AI*\n\n${content}`,
            parse_mode: "Markdown",
            reply_markup: {
                inline_keyboard: [
                    [
                        { text: "🏆 Ranking", callback_data: "ranking" },
                        { text: "⭐ XP", callback_data: "xp" }
                    ],
                    [
                        { text: "📋 Tasks", callback_data: "tasks" },
                        { text: "🤖 AI", callback_data: "ai" }
                    ]
                ]
            }
        })
    })
}

</script>

</body>

</html>
