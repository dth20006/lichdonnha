<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Homestay Vân Canh</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
    font-family: 'Inter', sans-serif;
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    font-size:32px;
    font-weight:700;
    margin-bottom:20px;
    text-align:center;
    color:#00f2ff;
}

.card{
    background:#1e293b;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
}

.users{
    display:flex;
    gap:10px;
}

.user{
    flex:1;
    padding:12px;
    background:#334155;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
    transition: 0.2s;
    font-weight: 600;
}

.user:hover {
    background: #475569;
}

.taskBox{
    display:flex;
    justify-content:space-between;
    align-items: center;
    padding:15px;
    background:#334155;
    border-radius:8px;
    margin-bottom:10px;
}

.taskCheck{
    width:22px;
    height:22px;
    cursor: pointer;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: none;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

button {
    background: #00f2ff;
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #00d4ff;
}

.status-done {
    color: #40c463;
    font-weight: bold;
}

.status-pending {
    color: #f85149;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<div class="title">🏠 Homestay Vân Canh</div>

<div class="card">
    <h3>Chọn thành viên</h3>
    <div class="users">
        <div class="user" onclick="login('Chi')">Chi</div>
        <div class="user" onclick="login('Kiệt')">Kiệt</div>
        <div class="user" onclick="login('Hùng')">Hùng</div>
    </div>
</div>

<div id="app" style="display:none">

    <div class="card">
        <h3>📅 Nhiệm vụ hôm nay của bạn</h3>
        <div id="tasks">Đang tải dữ liệu...</div>
    </div>

    <div class="card">
        <h3>✅ Trạng thái hôm nay</h3>
        <div id="dailyStatus">Đang tải dữ liệu...</div>
    </div>

    <div class="card">
        <h3>🛒 Mua đồ chung</h3>
        <input id="foodName" placeholder="Tên món đồ / Dịch vụ">
        <input id="foodPrice" type="number" placeholder="Tổng tiền (VNĐ)">
        <select id="buyer">
            <option>Chi</option>
            <option>Kiệt</option>
            <option>Hùng</option>
        </select>
        <button onclick="addBill()">Thêm hóa đơn</button>
        
        <h4 style="margin-top: 20px;">Lịch sử hóa đơn</h4>
        <div id="billList"></div>
    </div>

    <div class="card">
        <h3>💳 Bảng thanh toán nợ</h3>
        <div id="debt"></div>
    </div>

</div>

</div>

<script>
/* FIREBASE CONFIG */
const firebaseConfig={
    apiKey:"AIzaSyCAH5iHPMiJ8DzAK_CvzlKOlpMlSzGJgLs",
    authDomain:"firebawweb.firebaseapp.com",
    projectId:"firebawweb",
    storageBucket:"firebawweb.firebasestorage.app",
    messagingSenderId:"246960541396",
    appId:"1:246960541396:web:f1c7774f4fdfcae71f7541"
}

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

/* TELEGRAM CONFIG */
const TOKEN="8701701011:AAHbo0avSZXuCX3hGY0NdezE_Ef51GZRE-c";
const CHAT_ID="-5237126120";

/* BIẾN TOÀN CỤC */
const users = ["Chi", "Kiệt", "Hùng"];
let user = "";
let schedule = {};

// Cache dữ liệu realtime
let globalTasks = [];
let globalBills = [];
let globalPayments = [];

/* LOGIN */
function login(name){
    user = name;
    document.getElementById("app").style.display = "block";
    window.scrollTo({ top: document.getElementById("app").offsetTop, behavior: 'smooth' });
    
    // Khởi chạy lắng nghe dữ liệu tổng
    listenData();
}

/* LẮNG NGHE TẤT CẢ DỮ LIỆU ĐỒNG THỜI */
function listenData(){
    // 1. Nhiệm vụ nhà
    db.collection("tasks").onSnapshot(snapshot => {
        globalTasks = [];
        snapshot.forEach(doc => globalTasks.push(doc.data()));
        assignAI(); 
        updateUI();
    });

    // 2. Hóa đơn mua đồ
    db.collection("bills").orderBy("time", "desc").onSnapshot(snapshot => {
        globalBills = [];
        snapshot.forEach(doc => globalBills.push(doc.data()));
        updateUI();
    });

    // 3. Lịch sử chuyển tiền trả nợ (Collection mới)
    db.collection("payments").onSnapshot(snapshot => {
        globalPayments = [];
        snapshot.forEach(doc => globalPayments.push(doc.data()));
        updateUI();
    });
}

/* AI PHÂN VIỆC */
function assignAI(){
    let score = {Chi:0, Kiệt:0, Hùng:0};
    globalTasks.forEach(d => score[d.user]++);

    let jobs = ["Đổ rác", "Rửa bát", "Nấu cơm"];
    let sorted = Object.entries(score).sort((a,b) => a[1]-b[1]);
    
    schedule = {};
    for(let i=0; i<sorted.length; i++){
        schedule[sorted[i][0]] = jobs[i];
    }
}

/* UPDATE TOÀN BỘ GIAO DIỆN */
function updateUI(){
    if(!user) return;
    
    renderTasks();
    renderBillHistory();
    
    // Tính toán cấn trừ nợ
    let balances = calculateBalances();
    
    // Render phần trạng thái và bảng nợ
    renderDailyStatus(balances);
    renderDebt(balances);
}

/* RENDER NHIỆM VỤ CÁ NHÂN */
function renderTasks(){
    let today = new Date().toDateString();
    let hasDoneToday = globalTasks.some(d => d.user === user && new Date(d.time).toDateString() === today);
    let job = schedule[user];

    if(hasDoneToday) {
        document.getElementById("tasks").innerHTML = `
            <div class="taskBox" style="justify-content: center;">
                <span class="status-done">🎉 Bạn đã hoàn thành nhiệm vụ hôm nay!</span>
            </div>
        `;
    } else {
        document.getElementById("tasks").innerHTML = `
            <div class="taskBox">
                <div>Nhiệm vụ của bạn: <b>${job}</b></div>
                <input class="taskCheck" type="checkbox" onclick="doneTask('${job}')">
            </div>
        `;
    }
}

/* LÀM XONG NHIỆM VỤ */
async function doneTask(job){
    await db.collection("tasks").add({
        user: user,
        job: job,
        time: Date.now()
    });
    confetti();
    sendTelegram(user, job);
}

/* TÍNH TOÁN TIỀN NỢ & TRẢ */
function calculateBalances() {
    let balances = {Chi:0, Kiệt:0, Hùng:0};
    
    // 1. Cộng tiền cho người mua, trừ tiền người xài chung
    globalBills.forEach(b => {
        balances[b.buyer] += b.price;
        users.forEach(u => balances[u] -= b.share);
    });

    // 2. Cấn trừ những khoản đã thanh toán qua nút "Đã chuyển"
    globalPayments.forEach(p => {
        balances[p.from] += p.amount;  // Người chuyển khoản được cộng lại balance
        balances[p.to] -= p.amount;    // Người nhận bị trừ bớt khoản đang được nợ
    });

    return balances; // Balance < 0 là Đang Nợ. Balance > 0 là Đang được nợ.
}

/* RENDER BẢNG TRẠNG THÁI HÔM NAY (KÈM TÌNH TRẠNG TIỀN BẠC DƯỚI NHIỆM VỤ) */
function renderDailyStatus(balances){
    let html = "";
    let today = new Date().toDateString();
    let tasksToday = globalTasks.filter(d => new Date(d.time).toDateString() === today);
    let usersDoneToday = tasksToday.map(d => d.user);

    users.forEach(u => {
        let isDone = usersDoneToday.includes(u);
        let taskStatus = isDone ? `<span class="status-done">Đã hoàn thành</span>` : `<span class="status-pending">Chưa hoàn thành</span>`;
        
        let financialStatus = "";
        
        // 1. Kiểm tra xem hôm nay có mua đồ không
        let spentToday = globalBills.filter(b => b.buyer === u && new Date(b.time).toDateString() === today).reduce((sum, b) => sum + b.price, 0);
        if(spentToday > 0) {
            financialStatus += `<div style="font-size: 14px; margin-top: 5px; color:#cbd5e1;">🛒 Đã mua đồ hôm nay: ${spentToday.toLocaleString('vi-VN')} VNĐ</div>`;
        }

        // 2. Hiện trạng thái nợ/trả ở dưới cùng
        let myBalance = balances[u] || 0;
        if(myBalance < 0) {
            financialStatus += `<div style="font-size: 14px; margin-top: 5px; color:#f85149;">💸 Đang nợ quỹ: ${Math.abs(myBalance).toLocaleString('vi-VN')} VNĐ</div>`;
        } else if (myBalance > 0) {
            financialStatus += `<div style="font-size: 14px; margin-top: 5px; color:#40c463;">💰 Quỹ cần trả lại: ${myBalance.toLocaleString('vi-VN')} VNĐ</div>`;
        }

        html += `
        <div class="taskBox" style="flex-direction: column; align-items: flex-start; border-left: 4px solid ${u===user?'#00f2ff':'transparent'};">
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px; color: ${u===user?'#00f2ff':'white'}">${u}</div>
            <div>Nhiệm vụ: ${taskStatus}</div>
            ${financialStatus}
        </div>
        `;
    });

    document.getElementById("dailyStatus").innerHTML = html;
}

/* THÊM HÓA ĐƠN */
async function addBill(){
    let food = document.getElementById("foodName").value;
    let price = parseInt(document.getElementById("foodPrice").value);
    let buyer = document.getElementById("buyer").value;

    if(!food || !price) {
        alert("Vui lòng nhập tên món và giá tiền!");
        return;
    }

    let share = Math.round(price / users.length);
    await db.collection("bills").add({
        food: food,
        price: price,
        buyer: buyer,
        share: share,
        time: Date.now()
    });

    document.getElementById("foodName").value = "";
    document.getElementById("foodPrice").value = "";

    sendBillTelegram(food, price, buyer, share);
}

/* RENDER LỊCH SỬ HÓA ĐƠN */
function renderBillHistory() {
    let html = "";
    globalBills.forEach(b => {
        html += `
        <div class="taskBox" style="flex-direction:column; align-items:flex-start; gap:5px;">
            <div style="font-weight:bold; color:#00f2ff;">${b.food}</div>
            <div>💰 Giá: ${b.price.toLocaleString('vi-VN')} VNĐ</div>
            <div style="font-size:13px; color:#cbd5e1;">💳 Người mua: ${b.buyer} (Mỗi người: ${b.share.toLocaleString('vi-VN')} VNĐ)</div>
        </div>
        `;
    });
    document.getElementById("billList").innerHTML = html;
}

/* BẢNG NỢ & NÚT THANH TOÁN */
function renderDebt(balances){
    let debtors = [];
    let creditors = [];

    users.forEach(u => {
        if(balances[u] < 0) debtors.push({name: u, amount: Math.abs(balances[u])});
        else if (balances[u] > 0) creditors.push({name: u, amount: balances[u]});
    });

    let html = "";
    let i = 0, j = 0;
    
    while(i < debtors.length && j < creditors.length) {
        let d = debtors[i];
        let c = creditors[j];
        let amountToPay = Math.min(d.amount, c.amount);
        
        if (amountToPay > 0) {
            html += `
            <div class="taskBox" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                <div style="font-size: 15px;">💸 <b>${d.name}</b> cần chuyển cho <b>${c.name}</b>: <span style="color:#00f2ff; font-weight:bold;">${amountToPay.toLocaleString('vi-VN')} VNĐ</span></div>
                ${user === d.name ? `<button style="background:#40c463; color:white; margin:0;" onclick="payDebt('${d.name}', '${c.name}', ${amountToPay})">✅ Xác nhận đã chuyển khoản</button>` : ''}
            </div>
            `;
        }

        d.amount -= amountToPay;
        c.amount -= amountToPay;
        if (d.amount === 0) i++;
        if (c.amount === 0) j++;
    }

    if(html === "") {
        html = `<div class="taskBox" style="justify-content:center; color:#40c463; font-weight:bold;">🎉 Tuyệt vời! Hiện tại không ai nợ ai.</div>`;
    }

    document.getElementById("debt").innerHTML = html;
}

/* XỬ LÝ KHI BẤM NÚT ĐÃ CHUYỂN KHOẢN */
async function payDebt(from, to, amount) {
    if(confirm(`Xác nhận bạn (${from}) ĐÃ CHUYỂN ${amount.toLocaleString('vi-VN')} VNĐ cho ${to}?`)) {
        await db.collection("payments").add({
            from: from,
            to: to,
            amount: amount,
            time: Date.now()
        });
        confetti();
        sendTelegramPayment(from, to, amount);
    }
}

/* GỬI TELEGRAM THÔNG BÁO (GIAO DIỆN HIỆN ĐẠI THEO STYLE DASHBOARD) */
function sendTelegram(name, job){
    let text = `🤖 <b>[HỆ THỐNG TỰ ĐỘNG]</b>\n\n🟢 <b>CẬP NHẬT NHIỆM VỤ:</b>\n👤 Thành viên: <b>${name}</b>\n✔️ Trạng thái: <b>Hoàn thành</b> (<i>${job}</i>)`;
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{ 
        method:"POST", 
        headers:{"Content-Type":"application/json"}, 
        body:JSON.stringify({chat_id: CHAT_ID, text: text, parse_mode: "HTML"}) 
    });
}

function sendBillTelegram(food, price, buyer, share){
    let text = `🤖 <b>[HỆ THỐNG TỰ ĐỘNG]</b>\n\n🧾 <b>BIÊN LAI MỚI:</b>\n🛍️ Mặt hàng: <b>${food}</b>\n💵 Tổng chi: <code>${price.toLocaleString('vi-VN')}đ</code>\n💳 Ứng trước: <b>${buyer}</b>\n📊 Cưa ra: <code>${share.toLocaleString('vi-VN')}đ / người</code>`;
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{ 
        method:"POST", 
        headers:{"Content-Type":"application/json"}, 
        body:JSON.stringify({chat_id: CHAT_ID, text: text, parse_mode: "HTML"}) 
    });
}

function sendTelegramPayment(from, to, amount) {
    let text = `🤖 <b>[HỆ THỐNG TỰ ĐỘNG]</b>\n\n💸 <b>XÁC NHẬN THANH TOÁN:</b>\n👤 Người chuyển: <b>${from}</b>\n🎯 Người nhận: <b>${to}</b>\n💰 Số tiền: <code>${amount.toLocaleString('vi-VN')}đ</code>\n\n✅ <i>Nợ đã được cấn trừ trên hệ thống!</i>`;
    fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{ 
        method:"POST", 
        headers:{"Content-Type":"application/json"}, 
        body:JSON.stringify({chat_id: CHAT_ID, text: text, parse_mode: "HTML"}) 
    });
}
</script>

</body>
</html>
